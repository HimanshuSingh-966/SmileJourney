services:
  - type: web
    name: smilejourney-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: APP_ENV
        value: production
      - key: ALLOWED_ORIGINS
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: B2_ENDPOINT_URL
        sync: false
      - key: B2_REGION
        sync: false
      - key: B2_BUCKET_NAME
        sync: false
      - key: B2_KEY_ID
        sync: false
      - key: B2_APPLICATION_KEY
        sync: false
      - key: HF_MODEL_REPO
        sync: false
      - key: HF_TOKEN
        sync: false
